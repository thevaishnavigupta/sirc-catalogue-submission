<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width,intial-scale=1.0">

    <title> SIRC Catalogue Submission</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">
    
        <h1>Welcome to Catalogue submission portal</h1>
        <h2>IIT Kharagpur</h2>
        <p>Please fill the following details</p>
   
    
    
       
<form
    action="https://script.google.com/macros/s/AKfycbzD1H_1ugjLEWqfAHpcm6QiauZqFqh9wYqg0uvWaYrIWwzLL2CicxWmWTL_9PYgRtHV/exec"
    method="POST"
    target="hidden_iframe"
    enctype="application/x-www-form-urlencoded">

    <label>Student Name</label>
    <input type="text" name="name"
        placeholder="Enter your name" required>

    <label>Team</label>
    <input type="text" name="team"
        placeholder="Enter your team" required>

    <label>University Name</label>
    <input type="text" name="university"
        placeholder="University Name" required>

    <label>Email ID</label>
    <input type="email" name="email"
        placeholder="Enter Email ID" required>

    <label>Upload File</label>
    <input type="file" id="fileInput">

    <input type="hidden" name="fileAttached"
        id="fileAttached" value="No">

    <button type="submit">Submit</button>

</form>

<iframe name="hidden_iframe" style="display:none;"></iframe>


        <iframe name="hidden_iframe"
        style="display:none;"></iframe>

        <script src="js/script.js"></script>   

    </div> 
    

</body>

</html>
