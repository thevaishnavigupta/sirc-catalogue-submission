<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width,intial-scale=1.0">

    <title> SIRC Catalogue Submission</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">
    
        <h1>Welcome to Catalogue submission portal</h1>
        <h2>IIT Kharagpur</h2>
        <p>Please fill the following details</p>
   
    
    
        <form 
          action="https://script.google.com/macros/s/AKfycbzD1H_1ugjLEWqfAHpcm6QiauZqFqh9wYqg0uvWaYrIWwzLL2CicxWmWTL_9PYgRtHV/exec"
          method="POST"
          target="hidden_iframe"
          enctype="application/x-www-form-urlencoded">
            
        
            <lable>Student Name</lable>
            <input type="text" placeholder="Enter your name"required>

            <lable>Team</lable>
            <input type="text" placeholder="Enter your team "required>

        
            <lable>University Name</lable>
            <input type="text" placeholder="University Name"required>
        
        
            <label>Email Id</label>
            <input type="email" placeholder="Enter Email Id"required>

        
            <label>Uplode file</label>
            <input type="file" id="fileinput">

            <input type="hidden" name="fileAttached"
            id="fileAttached" value="No">
            
            <button type="submit">Submit </button>
        
    
        </form>

        <iframe name="hidden_iframe"
        style="display:none;"></iframe>

        <script src="js/script.js"></script>   

    </div> 
    

</body>

</html>
